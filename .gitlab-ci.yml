variables:
  COMMON_BIND_HOST: "0.0.0.0"
  DEPLOY_DOCKER_HELM: "true"
  DEPLOY_TIMESTAMP: "$DEPLOY_TIMESTAMP"
  DOCKER_DRIVER: "$DIND_DRIVER"
  DOCKER_HOST: "$DIND_HOST"
  DOCKER_TLS_CERTDIR: "$DIND_TLS_CERTDIR"
  MAVEN_CLI: "-Ddocker.registry=$DOCKER_REGISTRY -Dhelm.deploy.url=$HELM_REGISTRY -Dhelm.deploy.type=$HELM_TYPE -Dmaven.deploy.releases=$MAVEN_DEPLOY_RELEASES -Dmaven.deploy.snapshots=$MAVEN_DEPLOY_SNAPSHOTS -Dversioning.configFile=maven-git-versioning-extension-ci.xml --batch-mode --errors --fail-fast --show-version"
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
  GIT_SUBMODULE_STRATEGY: recursive
  # Language of the manual "screenshots mock" job (see below). Offered as a dropdown in the
  # "Run pipeline" form; can also be set when starting the manual job itself.
  E2E_MOCK_LOCALE:
    value: "de"
    options:
      - "de"
      - "en"
      - "fr"
      - "it"
      - "none"
    description: "Language of the screenshots produced by the manual job \"screenshots mock\". \"none\" renders the raw i18n keys."


default:
  #image: maven:3.8.4-eclipse-temurin-17
  # NOTE: stay on Maven 3.9.9 — Maven >3.9.9 dropped the legacy org.sonatype SecDispatcher
  # component that io.fabric8:docker-maven-plugin:0.39.1 looks up to read registry credentials,
  # which breaks the docker `push` goal ("Error looking security dispatcher").
  image: maven:3.9.9-eclipse-temurin-21-noble
  services:
    - name: "$DIND_IMAGE"
      alias: docker
      entrypoint: [ "env", "-u", "DOCKER_HOST" ]
      command: [ "dockerd-entrypoint.sh" ]

stages:
  - build
  - test
  - deploy

deploy:
  stage: deploy
  cache:
    - key: $CI_BUILD_REF_NAME
      paths:
        - .m2/repository
    - key:
        files:
          - Frontend/package-lock.json
        prefix: node-modules-$NODE_VERSION
      paths:
        - Frontend/node_modules
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^maven\/release\/.*/ && $CI_PIPELINE_SOURCE == "pipeline"
    - if: $CI_COMMIT_TAG && $CI_PIPELINE_SOURCE == "pipeline"
    - if: $CI_COMMIT_BRANCH !~ /^maven\/release\/.*/ && $CI_COMMIT_TAG == null
  before_script:
    - apt-get update -y
    - apt-get install -y git
  script:
    - mvn $MAVEN_CLI -s .mvn/settings.xml deploy

.frontend_job: &frontend_job
  variables:
    NODE_VERSION: 24.9
  stage: test
  image: node:$NODE_VERSION-alpine
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^maven\/release\/.*/ && $CI_PIPELINE_SOURCE == "pipeline"
    - if: $CI_COMMIT_TAG && $CI_PIPELINE_SOURCE == "pipeline"
    - if: $CI_COMMIT_BRANCH !~ /^maven\/release\/.*/ && $CI_COMMIT_TAG == null
  cache:
    key:
      files:
        - Frontend/package-lock.json
      prefix: node-modules-$NODE_VERSION  
    paths:
      - Frontend/node_modules
  before_script:
    - cd Frontend
    - node -v
    - npm -v
    # Install dependencies on cache miss, e.g., when first running on a ci runner.
    - ([[ -d node_modules ]] || npm ci)


check formatting:
  <<: *frontend_job
  allow_failure: false
  script:
    - npm run check:format

check linting:
  <<: *frontend_job
  allow_failure: false
  script:
    - npm run check:lint

npm security audit:
  <<: *frontend_job
  allow_failure: true
  script:
    - npm audit --audit-level=high

unittest frontend:
  <<: *frontend_job
  variables:
    NODE_VERSION: 24.9
    CHROME_BIN: /usr/bin/chromium-browser
  before_script:
    - apk add chromium
    - node -v
    - npm -v
    - cd Frontend
    # Install dependencies on cache miss, e.g., when first running on a ci runner.
    - ([[ -d node_modules ]] || npm ci)
    - mkdir -p projects/edu-sharing-api/build/
    - cp ../Backend/services/rest/api/src/main/resources/openapi.json projects/edu-sharing-api/build/openapi.json
    - cd projects/edu-sharing-api
    - npm run generate-api
    - cd ../..
  script:
    - npm run prebuild
    - npm run test-ci

# Builds the application and the mock backend for the "e2e mock" job below.
# Runs on the same image/cache as the other frontend jobs so the Angular build stays warm.
build frontend mock:
  <<: *frontend_job
  stage: build
  variables:
    NODE_VERSION: 24.9
  before_script:
    - node -v
    - npm -v
    - cd Frontend
    # Install dependencies on cache miss, e.g., when first running on a ci runner.
    - ([[ -d node_modules ]] || npm ci)
    - mkdir -p projects/edu-sharing-api/build/
    - cp ../Backend/services/rest/api/src/main/resources/openapi.json projects/edu-sharing-api/build/openapi.json
    - cd projects/edu-sharing-api
    - npm run generate-api
    - cd ../..
  script:
    # No library build at all: the `mock` configuration compiles against `tsconfig.mock.json`,
    # which maps every `ngx-*` package to its sources instead of `dist/` - so neither `prebuild`
    # (~4min) nor packaging the three generated API clients (~35s) is needed. Verified to render
    # pixel-identically to a build against the packaged libraries.
    #
    # The configuration also keeps `environment.production === false`, which is required:
    # translations are then loaded from local assets and the startup redirect stays client-side.
    # And it builds unoptimized - that is ~2x faster and, again, pixel-identical.
    - npm run build:mock
    # The rendering-service web component. It is what the standalone RS2 module harness mounts
    # (`/rs2-harness`), so the renderer modules can be screenshotted without the application.
    - npm run build:mock-web-component
    - npm run build:mock-backend
  artifacts:
    paths:
      - Frontend/dist-mock/
      - Frontend/dist-mock-web-components/
      - Frontend/e2e-tests/build/
    expire_in: 1 day

# Validates the frontend against the mock backend, including screenshot comparison.
# Runs on every build - no real repository required.
e2e mock:
  stage: test
  # Pinned image: identical browser, fonts and rendering as when the baselines were recorded.
  image: mcr.microsoft.com/playwright:v1.57.0-noble
  needs: ["build frontend mock"]
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^maven\/release\/.*/ && $CI_PIPELINE_SOURCE == "pipeline"
    - if: $CI_COMMIT_TAG && $CI_PIPELINE_SOURCE == "pipeline"
    - if: $CI_COMMIT_BRANCH !~ /^maven\/release\/.*/ && $CI_COMMIT_TAG == null
  cache:
    # Own cache key: this image is glibc-based, the other frontend jobs run on alpine (musl),
    # so their node_modules (native bindings) must not be shared.
    key:
      files:
        - Frontend/package-lock.json
      prefix: node-modules-playwright-1.57.0
    paths:
      - Frontend/node_modules
  variables:
    # A scenario without a committed baseline fails the build instead of silently skipping the
    # visual comparison.
    E2E_MOCK_REQUIRE_BASELINES: "1"
    # Pinned: the baselines are recorded with `locale=none` (raw i18n keys), so this job must not
    # inherit the pipeline-level language of the manual "screenshots mock" job.
    E2E_MOCK_LOCALE: "none"
  before_script:
    - cd Frontend
    - node -v
    - npm -v
    - ([[ -d node_modules ]] || npm ci)
  script:
    - npm run e2e:mock
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - Frontend/e2e-tests/report/
      # Contains "-actual.png" / "-diff.png" of failed screenshot comparisons.
      - Frontend/e2e-tests/test-results/
      # Endpoints the app requested but the mock does not implement.
      - Frontend/e2e-tests/build/unmocked.log
    reports:
      junit: Frontend/e2e-tests/report/junit.xml

build storybook:
  <<: *frontend_job
  variables:
    NODE_VERSION: 24.9
  before_script:
    - node -v
    - npm -v
    - cd Frontend
    # Install dependencies on cache miss, e.g., when first running on a ci runner.
    - ([[ -d node_modules ]] || npm ci)
    - mkdir -p projects/edu-sharing-api/build/
    - cp ../Backend/services/rest/api/src/main/resources/openapi.json projects/edu-sharing-api/build/openapi.json
    - cd projects/edu-sharing-api
    - npm run generate-api
    - cd ../..
  script:
    - npm run prebuild
    - npm run build:storybook



test docker:
  stage: test
  cache:
    - key: $CI_BUILD_REF_NAME
      paths:
        - .m2/repository
    - key:
        files:
          - Frontend/package-lock.json
        prefix: node-modules-$NODE_VERSION
      paths:
        - Frontend/node_modules
  artifacts:
    paths:
      - deploy/docker/compose/target/compose/openapi.json
      - deploy/docker/build/service/target/build/rest-api/openapi.json
    when: always
    expire_in: 3 day
  before_script:
    - apt-get update -y
    - apt-get install -y ca-certificates curl gnupg jq lsb-release wait-for-it
    - mkdir -p /etc/apt/keyrings
    - curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
    - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null
    - apt-get update -y
    - apt-get install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin docker-compose
    - apt-get install -y php php-curl php-dom php-gd php-mbstring php-xml php-zip
    - docker info
    - docker version
    - docker login $DOCKER_REGISTRY -u $DOCKER_USERNAME -p $DOCKER_PASSWORD
  script:
    - mkdir -p "$MAVEN_HOME"
    - mvn $MAVEN_CLI -s .mvn/settings.xml install
    - pushd deploy/docker/compose/target/compose
    - docker compose -f 1_repository-common.yml -f 1_redis-common.yml up -d
    - "until wait-for-it docker:8100 -t 3; do sleep 1; done"
    - |
      while true
      do
              echo "waiting for api to come available..."
              STATUS=$(curl -sS -w "%{http_code}" -o /dev/null -H 'Accept: application/json' http://docker:8100/edu-sharing/rest/_about/status/SERVICE?timeoutSeconds=3);
              echo "API Status: $STATUS"
              if [ "$STATUS" = "200" ]; then echo "Repository status 200 detected"; break; fi;
              if [ "$STATUS" = "404" ]; then docker compose -f 1_repository-common.yml -f 1_redis-common.yml logs; exit 1; fi;
              sleep 1;
      done
    - "curl -m 300 -H 'Accept: application/json' --user 'admin:admin' http://docker:8100/edu-sharing/rest/openapi.json | jq -S . > openapi.json"
    - docker compose -f 1_repository-common.yml -f 1_redis-common.yml down -v
    - cmp -s openapi.json ../../../build/service/target/build/rest-api/openapi.json || exit 1
    - popd
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^maven\/release\/.*/ && $CI_PIPELINE_SOURCE == "pipeline" && $SKIP_TESTS != "true"
    - if: $CI_COMMIT_TAG && $CI_PIPELINE_SOURCE == "pipeline" && $SKIP_TESTS != "true"
    - if: $CI_COMMIT_BRANCH !~ /^maven\/release\/.*/ && $CI_COMMIT_TAG == null && $CI_PIPELINE_SOURCE == "pipeline" && $SKIP_TESTS != "true"

e2e:
  stage: test
  cache:
    - key: $CI_BUILD_REF_NAME
      paths:
        - .m2/repository
    - key:
        files:
          - Frontend/package-lock.json
        prefix: node-modules-$NODE_VERSION
      paths:
        - Frontend/node_modules
  artifacts:
    paths:
      - repository/Frontend/src/generated/ng/playwright-report/
    when: always
  before_script:
    - apt-get update -y
    - apt-get install -y ca-certificates curl gnupg jq lsb-release wait-for-it
    - mkdir -p /etc/apt/keyrings
    - curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
    - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null
    - apt-get update -y
    - apt-get install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin docker-compose
    - apt-get install -y php php-curl php-dom php-gd php-mbstring php-xml php-zip
    - curl -fsSL https://deb.nodesource.com/setup_16.x | bash - && apt-get install -y nodejs
    - docker login $DOCKER_REGISTRY -u $DOCKER_USERNAME -p $DOCKER_PASSWORD
  variables:
    E2E_TEST_BASE_URL: http://docker:8100/edu-sharing/
    REPOSITORY_SERVICE_HOST: docker
    REPOSITORY_SERVICE_PORT: 8100
  script:
    - mkdir -p "$MAVEN_HOME"
    - mvn $MAVEN_CLI -s .mvn/settings.xml install
    - pushd deploy/docker/compose/target/compose
    - docker compose -f 1_repository-common.yml -f 1_redis-common.yml up -d
    - pushd ../../../../../repository/Frontend
    - npx playwright install --with-deps
    - "until wait-for-it docker:8100 -t 3; do sleep 1; done"
    - "until [[ $(curl -sSf -w '%{http_code}\n' -o /dev/null -H 'Accept: application/json' http://docker:8100/edu-sharing/rest/_about/status/SERVICE?timeoutSeconds=3) -eq 200 ]]; do sleep 1; done"
    - npm run e2e-prepare-edu-sharing
    - npm run e2e
    - popd
    - docker compose -f 1_repository-common.yml -f 1_redis-common.yml down -v
    - popd
  only:
    variables:
      - $E2E_TEST == "true"

check-helmreadme:
  stage: test
  image: node:lts-alpine3.20
  before_script:
    - ln -s $CI_PROJECT_DIR/deploy/docker/helm/search-solr/src/main/chart /tmp/search-solr && cp /tmp/search-solr/README.md /tmp/README_search-solr.md
    - ln -s $CI_PROJECT_DIR/deploy/docker/helm/service/src/main/chart /tmp/service && cp /tmp/service/README.md /tmp/README_service.md
    - ln -s $CI_PROJECT_DIR/deploy/docker/helm/transform-aio/src/main/chart /tmp/transform-aio && cp /tmp/transform-aio/README.md /tmp/README_transform-aio.md
    - ln -s $CI_PROJECT_DIR/deploy/docker/helm/transform-es/src/main/chart /tmp/transform-es && cp /tmp/transform-es/README.md /tmp/README_transform-es.md
  script:
    - wget -qO- https://github.com/bitnami/readme-generator-for-helm/archive/refs/tags/2.6.1.tar.gz | tar -xz -C /tmp
    - cd /tmp; npm install ./readme-generator-for-helm-2.6.1; cd readme-generator-for-helm-2.6.1
    - ./bin/index.js -v /tmp/search-solr/values.yaml -r /tmp/README_search-solr.md
    - ./bin/index.js -v /tmp/service/values.yaml -r /tmp/README_service.md
    - ./bin/index.js -v /tmp/transform-aio/values.yaml -r /tmp/README_transform-aio.md
    - ./bin/index.js -v /tmp/transform-es/values.yaml -r /tmp/README_transform-es.md
    - diff /tmp/README_search-solr.md /tmp/search-solr/README.md     || (echo "README was not generated before committing." && exit 1)
    - diff /tmp/README_service.md /tmp/service/README.md             || (echo "README was not generated before committing." && exit 1)
    - diff /tmp/README_transform-aio.md /tmp/transform-aio/README.md || (echo "README was not generated before committing." && exit 1)
    - diff /tmp/README_transform-es.md /tmp/transform-es/README.md   || (echo "README was not generated before committing." && exit 1)

# Produces readable screenshots of every scenario for the UX and documentation teams.
#
# Manual on purpose: it is not a gate, it is an export. It renders the same scenarios as `e2e mock`
# but in a real language (`E2E_MOCK_LOCALE`, default German) and *writes* the screenshots instead of
# comparing them - a translated label differs from every committed baseline by definition, so a
# comparison would be meaningless here.
screenshots mock:
  stage: test
  image: mcr.microsoft.com/playwright:v1.57.0-noble
  needs: ["build frontend mock"]
  when: manual
  # A failing scenario must not cost the screenshots that were already taken.
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH !~ /^maven\/release\/.*/ && $CI_COMMIT_TAG == null
  cache:
    key:
      files:
        - Frontend/package-lock.json
      prefix: node-modules-playwright-1.57.0
    paths:
      - Frontend/node_modules
  before_script:
    - cd Frontend
    - ([[ -d node_modules ]] || npm ci)
  script:
    - npm run e2e:mock:capture
  artifacts:
    when: always
    expire_in: 4 weeks
    name: "screenshots-$E2E_MOCK_LOCALE-$CI_COMMIT_SHORT_SHA"
    paths:
      # One folder per project: chromium / chromium-dark / mobile / mobile-dark.
      - Frontend/e2e-tests/screenshots/
